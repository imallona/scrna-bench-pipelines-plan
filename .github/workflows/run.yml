name: run_ob_main_oras
on:
  push:
  workflow_dispatch:
  # schedule:
  #   - cron: "30 1 * * *" # at 1.30am
    
jobs:
  run-benchmark:
    name: Run on oras
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use action 
        uses: omnibenchmark/run_omnibenchmark@main
        env:
          SINGULARITY_HOME: ${{ github.workspace }}
        with:
          yaml: benchmark.yaml
          backend: apptainer
          omnibenchmark_branch: 'main'

      - name: Print logs
        run: |
          shopt -s globstar
          head -100000 out/**/*.log || true

