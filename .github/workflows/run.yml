name: run_ob_main_oras
on:
  push:
  workflow_dispatch:
  # schedule:
  #   - cron: "30 1 * * *" # at 1.30am
    
jobs:
  run-benchmark:
    name: Run on oras
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use action 
        uses: omnibenchmark/run_omnibenchmark@main
        env:
          SINGULARITY_HOME: ${{ github.workspace }}
        with:
          yaml: benchmark.yaml
          backend: apptainer
          omnibenchmark_branch: 'main'
          #extra_args: " -- --singularity-args \"--home=${GITHUB_WORKSPACE} --bind=${PWD}\""
          #extra_args: '-- --singularity-args "--home=${GITHUB_WORKSPACE} --bind=${GITHUB_WORKSPACE}"'
          #extra_args: " -- --singularity-args \"--home=${GITHUB_WORKSPACE} --bind=${GITHUB_WORKSPACE}\""
          #extra_args: " -- --singularity-args \"--home=${{ github.workspace }} --bind=${{ github.workspace }}\""
